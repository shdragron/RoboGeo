# @package _global_
# GaussianLSS recipe (upstream optimizer and schedule): AdamW + OneCycleLR with linear
# annealing, 50 epochs. The cycle spans the whole run (trainer.estimated_stepping_batches).
optimizer:
  lr: 3e-4
  weight_decay: 1e-7
scheduler:
  div_factor: 3
  pct_start: 0.05
  final_div_factor: 20
  max_lr: ${optimizer.lr}
  total_steps: ${trainer.max_steps}
  cycle_momentum: False
  anneal_strategy: linear
  interval: step
trainer:
  max_steps: -1
  max_epochs: 50

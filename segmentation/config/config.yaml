# Root config. Select a model with +experiment=gaussianlss or +experiment=cvt.
# The defaults reproduce the recipe of the released checkpoints.
defaults:
  - _self_
  - model: null
  - data: carla
  - gt: seg_center_offset
  - loss: null
  - metrics: bev_metrics
  - recipe: gaussianlss

experiment:
  project: ???                       # log directory name, set by the experiment
  uuid: ${now:%Y_%m%d_%H%M%S}        # run name; reuse it to resume training
  save_dir: ${hydra:runtime.cwd}/logs/
  seed: 2025
  log_image_interval: 500            # read by the GaussianLSS ModelModule

key: vehicle                         # prediction and label key
min_visibility: 2                    # loss and IoU ignore cells with visibility < 2
val_only: False

loader:
  train_batch_size: 16               # per GPU: 2 GPUs x 16 = global batch 32
  val_batch_size: 16
  num_workers: 4
  pin_memory: True
  prefetch_factor: 2
  persistent_workers: False

# Lightning trainer; the recipe sets max_epochs.
trainer:
  max_steps: -1
  max_epochs: ???
  log_every_n_steps: 40
  devices: 2
  accelerator: gpu
  precision: 32                      # fp32 with TF32 matmul
  limit_train_batches: 1.0
  limit_val_batches: 1.0
  check_val_every_n_epoch: 1
  val_check_interval: 1.0
  num_sanity_val_steps: 0
  gradient_clip_val: 5.0
  sync_batchnorm: True

ckpt: null                           # checkpoint to evaluate (bevunify.eval)

eval:
  protocol: normal                   # normal | vp (viewpoint perturbation) | cts (cross-platform transfer)
  subset: full                       # full: all 3,792 evaluation frames; fps16: 768 frames, quick checks only
  cells: all                         # 'all' or a list of cell ids, e.g. [vp/NORMAL,vp/IMG/all/pitch+8]
  target: null                       # cts: suv | bus
  oracle_ckpt: null                  # cts: checkpoint trained on eval.target, evaluates cts/<target>/ORACLE
  out_dir: ${hydra:runtime.cwd}/eval_results/${experiment.project}_${eval.subset}
  threshold: 0.5
  num_threads: 8                     # image loading threads
  cache_images: True                 # keep unperturbed images in RAM (about 29 GB for the full split)
